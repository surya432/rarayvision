
services:
  db:
    image: postgres:14
    container_name: rarayvision-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rarayvision}
      POSTGRES_USER: ${DB_USER:-raray}
      POSTGRES_PASSWORD: ${DB_PASS:-}
      POSTGRES_PORT: ${DB_PORT:-5432}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - raray-network

  backend:
    build: 
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        HTTP_PROXY: ${HTTP_PROXY:-}
        APT_PROXY: ${APT_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: rarayvision-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - raray-network
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/models:/app/backend/models
      - ./backend/ml_models:/root/.insightface/models/
    # Ports are omitted because frontend nginx proxies requests

  frontend:
    build:
      context: ./frontend
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        HTTP_PROXY: ${HTTP_PROXY:-}
        APT_PROXY: ${APT_PROXY:-}
        NO_PROXY: ${no_proxy:-}
        no_proxy: ${no_proxy:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:5000}
    container_name: rarayvision-frontend
    restart: unless-stopped
    environment:
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTP_PROXY:-}
      - no_proxy=${no_proxy:-}
    depends_on:
      - backend
      - db
    networks:
      - raray-network
    ports:
      - "8001:80"

volumes:
  db_data:

networks:
  raray-network:
    driver: bridge
    name: raray-network